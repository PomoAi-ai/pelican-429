<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#f6f8fc"/><text x="48" y="60" font-family="PingFang SC,Arial,sans-serif" font-size="36" fill="#20497a">24款角色定义 · 第1批</text><text x="48" y="100" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#61738c">目标3.3头身｜同骨架、变体宽厚｜每批4款｜本页为定义，不表示已绘制</text><rect x="40" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R01  经典水手裙</text><text x="65" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">均衡｜春夏｜已绘制·待核对</text><text x="65" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：柔和圆脸；圆蓝眼；平缓眉，短小圆鼻，微笑</text><text x="65" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：黑色齐肩直发；侧分刘海，发尾内收，露出部分耳廓</text><text x="65" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：象牙白水手领短袖上衣、藏蓝百褶短裙、暗红领结</text><text x="65" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：白色短袜、藏蓝圆头玛丽珍鞋</text><text x="65" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：棉质上衣、哑光裙布；胸前领结与背后方领独立成层</text><text x="65" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：侧面保留短躯干；背面方领双白线，裙褶围绕腰线连续；鞋扣</text><text x="65" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">左右一致</text><rect x="820" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R02  夏日水手短裤</text><text x="845" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">纤细｜夏｜已绘制·待核对</text><text x="845" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：短心形脸；圆灰蓝眼；细平眉，小鼻，轻微微笑</text><text x="845" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：银灰耳上短发；蓬松侧扫，细碎后颈，单侧交叉发夹</text><text x="845" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：天蓝短袖水手上衣、象牙白领巾、藏蓝高腰短裤</text><text x="845" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：白色帆布低帮鞋、白色短袜</text><text x="845" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：轻棉布、短裤斜纹布、帆布鞋；不画丝袜或深色腿部阴影</text><text x="845" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：短裤后袋仅在背面出现；发夹固定角色左侧，不镜像；腿纤细</text><text x="845" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">但保留膝踝体积</text><rect x="40" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R03  牛仔背带短裤</text><text x="65" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">微胖｜春夏｜已绘制·待核对</text><text x="65" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：饱满椭圆脸；圆棕眼；柔眉，浅酒窝</text><text x="65" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：栗棕齐肩波浪半扎；小发束，后脑体积饱满</text><text x="65" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：杏色圆领短袖、浅蓝牛仔背带短裤、雏菊胸袋</text><text x="65" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：米白帆布鞋、短袜</text><text x="65" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：轻棉T恤、洗水牛仔；胸袋、扣件、双肩带是独立结构</text><text x="65" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：厚度分布在上臂、腰腹、臀腿；侧面自然圆腹，背面双后袋；</text><text x="65" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">不能只加粗腿</text><rect x="820" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R10  田径运动员</text><text x="845" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">健壮｜夏｜已绘制·待核对</text><text x="845" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：椭圆脸；榛色圆眼；浅雀斑，积极表情</text><text x="845" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：栗棕高马尾；侧分刘海，基础头顶与马尾分开识别</text><text x="845" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：蓝白全长运动背心、藏蓝侧条纹跑步短裤</text><text x="845" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：蓝白跑鞋、白色短袜</text><text x="845" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：哑光运动针织，鞋面网布以大色块表现；禁止湿亮皮肤</text><text x="845" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：上臂、肩膀、小腿共同体现运动型；衣服覆盖躯干；马尾不计</text><text x="845" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">入身高尺</text></svg>