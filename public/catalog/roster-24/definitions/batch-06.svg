<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#f6f8fc"/><text x="48" y="60" font-family="PingFang SC,Arial,sans-serif" font-size="36" fill="#20497a">24款角色定义 · 第6批</text><text x="48" y="100" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#61738c">目标3.3头身｜同骨架、变体宽厚｜每批4款｜本页为定义，不表示已绘制</text><rect x="40" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R21  星纹法师</text><text x="65" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">纤细｜秋冬·幻想｜已绘制·待核对</text><text x="65" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：柔和圆脸；大圆蓝眼；平缓眉，平静表情</text><text x="65" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：橙金编辫短波波；单侧小白花，承接原参考女孩</text><text x="65" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：深蓝金边短斗篷、星纹长袖上衣、藏蓝直筒裤</text><text x="65" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕黑短靴；星形扣件，小披肩可拆</text><text x="65" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：哑光织物、少量金属扣；星纹为平面图案，非灯光</text><text x="65" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背面斗篷星纹完整；侧面手臂不与斗篷融合；不添加精灵耳或</text><text x="65" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">长袍遮住全部腿</text><rect x="820" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R22  礼服军官</text><text x="845" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">均衡｜四季·礼仪｜已绘制·待核对</text><text x="845" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：鹅蛋脸；灰蓝圆眼；清晰平眉，端正表情</text><text x="845" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：黑色低盘发；偏分刘海，头后小髻</text><text x="845" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：藏蓝立领礼服短上衣、银色滚边、同色直筒长裤</text><text x="845" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：黑色低跟短靴、白手套；礼帽另附</text><text x="845" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：哑光精纺呢、低反射银扣；不出现现实军衔或组织标识</text><text x="845" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：后背省线与腰线固定；肩饰小而扁；正侧面靴跟同高</text><rect x="40" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R23  冬日居家</text><text x="65" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">微胖｜冬·室内｜已绘制·待核对</text><text x="65" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：圆脸；暖棕圆眼；短柔眉，放松表情</text><text x="65" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：栗棕侧低松马尾；碎发自然，不遮面</text><text x="65" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：燕麦色宽松针织上衣、淡灰绿家居长裤</text><text x="65" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：暖棕包跟居家鞋</text><text x="65" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：软针织、棉裤、绒面鞋；以轮廓体现柔软，少画绒毛</text><text x="65" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背面针织下摆同长；侧面腹腰自然圆润；裤脚不能吞掉整只脚</text><rect x="820" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R24  足球运动员</text><text x="845" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">健壮｜夏｜已绘制·待核对</text><text x="845" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：宽椭圆脸；深棕圆眼；直眉，坚定笑容</text><text x="845" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：黑色耳上短卷发；小束卷曲，轮廓紧凑</text><text x="845" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：青白足球短袖球衣、深青运动短裤、白色长运动袜</text><text x="845" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：青黑足球鞋；护腿板在袜内</text><text x="845" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：运动涤纶、哑光鞋面；鞋钉作为鞋底结构，不在脚边画尖刺</text><text x="845" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背面仅抽象小队标，无现实品牌；膝盖位置与基础骨架一致；</text><text x="845" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">头发四面卷束一致</text></svg>