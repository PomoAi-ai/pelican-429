<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#f6f8fc"/><text x="48" y="60" font-family="PingFang SC,Arial,sans-serif" font-size="36" fill="#20497a">24款角色定义 · 第2批</text><text x="48" y="100" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#61738c">目标3.3头身｜同骨架、变体宽厚｜每批4款｜本页为定义，不表示已绘制</text><rect x="40" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R04  秋日针织</text><text x="65" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">微胖｜秋｜已绘制·待核对</text><text x="65" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：圆脸；榛色圆眼；柔和短眉，鼻尖圆润</text><text x="65" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：深棕齐下巴圆弧波波头；短齐刘海，不遮眼</text><text x="65" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：苔绿宽松短开衫、奶油内搭、焦糖A字短裙</text><text x="65" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕色踝靴、奶油罗纹短袜</text><text x="65" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：低频针织纹、哑光棉裙、软皮鞋；开衫留可见下摆层次</text><text x="65" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：侧面开衫盖住腰带但不改变腰高；后背无多余蝴蝶结；裙摆与</text><text x="65" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">臀部留间隙</text><rect x="820" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R05  冬日旅行</text><text x="845" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">均衡｜冬｜已绘制·待核对</text><text x="845" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：椭圆脸；蓝眼；清晰但不尖锐的眉眼，淡雀斑</text><text x="845" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：橙金色单侧长辫；辫尾至腰，刘海与D1家族一致</text><text x="845" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：象牙白短呢大衣、青绿围巾、藏蓝直筒长裤</text><text x="845" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕色平底保暖靴、薄手套</text><text x="845" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：毛呢、针织围巾、磨砂皮靴；表面不添加强高光</text><text x="845" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：围巾垂尾固定一侧；侧面衣厚不等于肥胖；背面大衣分缝与辫</text><text x="845" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">子清晰</text><rect x="40" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R06  东方轻装</text><text x="65" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">纤细｜春｜已绘制·待核对</text><text x="65" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：柔和鹅蛋脸；深绿圆眼；平眉，小嘴</text><text x="65" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：黑色低发髻；中分两条短鬓发，髻不超过头高基线</text><text x="65" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：玉色交领短外套、米白九分直筒裤、深青布腰带</text><text x="65" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：深青布面平底鞋</text><text x="65" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：棉麻、低光泽滚边；交领左右压叠方向固定</text><text x="65" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背面腰带结小而清楚；侧面裤腿不贴成裙；手腕与脚踝留关节</text><text x="65" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">空间</text><rect x="820" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R09  野外训练军人</text><text x="845" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">健壮｜春秋｜已绘制·待核对</text><text x="845" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：短方圆脸；琥珀圆眼；直眉，坚定表情</text><text x="845" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：黑色极短碎发；露耳，短鬓角，不剃光</text><text x="845" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：橄榄绿训练夹克、低对比迷彩工装长裤、深绿腰带</text><text x="845" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕色低筒作战靴</text><text x="845" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：耐磨斜纹布与哑光皮革；不出现现实军徽、枪械</text><text x="845" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：肩袖、肘膝活动区明确；背面衣褶简洁；健壮来自肩臂与小腿</text><text x="845" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">而非拉高身材</text></svg>