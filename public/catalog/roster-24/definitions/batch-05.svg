<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#f6f8fc"/><text x="48" y="60" font-family="PingFang SC,Arial,sans-serif" font-size="36" fill="#20497a">24款角色定义 · 第5批</text><text x="48" y="100" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#61738c">目标3.3头身｜同骨架、变体宽厚｜每批4款｜本页为定义，不表示已绘制</text><rect x="40" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R17  雨天出行</text><text x="65" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">纤细｜春夏雨季｜已绘制·待核对</text><text x="65" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：窄鹅蛋脸；蓝灰圆眼；柔眉，安静表情</text><text x="65" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：蓝黑锁骨直发；轻薄齐刘海，露出双眼</text><text x="65" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：湖蓝短雨衣、米白短裤、袖口收束</text><text x="65" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：藏蓝雨靴；兜帽垂在背后，透明伞另附</text><text x="65" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：低光泽防水面料；避免整件塑料高光</text><text x="65" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背后兜帽开口和肩部接缝；雨靴筒口与腿分离；前后短裤长度</text><text x="65" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">相同</text><rect x="820" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R18  都市侦探</text><text x="845" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">均衡｜秋｜已绘制·待核对</text><text x="845" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：短方圆脸；琥珀圆眼；平眉，若有所思</text><text x="845" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：酒红耳下短发；侧分柔卷，后颈利落</text><text x="845" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：驼色短风衣、炭灰马甲、米白衬衣、细格长裤</text><text x="845" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕色系带皮鞋</text><text x="845" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：棉风衣、毛料马甲、哑光皮鞋；格纹稀疏</text><text x="845" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背后短覆肩和中缝明确；风衣长度不遮膝；手不持放大镜</text><rect x="40" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R19  园艺师</text><text x="65" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">微胖｜春夏｜已绘制·待核对</text><text x="65" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：圆润梨形脸；绿色圆眼；柔眉，淡雀斑</text><text x="65" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：铜棕蓬松短卷发；自然圆轮廓，不戴帽</text><text x="65" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：浅绿短袖、卡其背带长裤、布质腰袋</text><text x="65" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：深棕橡胶底园艺鞋；手套可拆</text><text x="65" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：棉T恤、厚帆布工装；尘土不烘焙成肤色污渍</text><text x="65" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背后背带交叉方式唯一；裤腿松量保留；侧面腰腹微胖且脚踝</text><text x="65" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">清晰</text><rect x="820" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R20  机械维修师</text><text x="845" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">健壮｜四季·工坊｜已绘制·待核对</text><text x="845" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：短方脸；钢蓝圆眼；浓眉，专注表情</text><text x="845" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：银灰短后梳；两侧短，顶部低体积</text><text x="845" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：灰蓝连体工装，腰部自然收束、袖子卷至肘下、少量橙色标识</text><text x="845" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕色安全鞋；腰部工具包可拆</text><text x="845" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：耐磨斜纹布、哑光金属扣；油污仅作为可选后期贴花</text><text x="845" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背面肩育克、腰线、口袋对应；连体服是工作服；手臂筋肉简</text><text x="845" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">化不过度写实</text></svg>