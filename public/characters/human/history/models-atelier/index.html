<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#model'),stage=canvas.parentElement,state=document.querySelector('#state');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.01,60);
const studio=new THREE.Scene();studio.background=new THREE.Color(0x64605b);
function diskLight(position,radius,color,power){
  const material=new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide});material.color.multiplyScalar(power);
  const disk=new THREE.Mesh(new THREE.CircleGeometry(radius,64),material);disk.position.set(...position);disk.lookAt(0,1.55,0);studio.add(disk);
}
diskLight([-3,6,4.5],2.5,0xfff2e8,5);diskLight([4,3.5,3],2.4,0xe7efff,2);diskLight([1,5,-4],1.8,0xffefdf,3);diskLight([0,.8,5],3,0xffead9,2.5);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(studio,.06).texture;scene.environmentIntensity=.8;pmrem.dispose();
studio.traverse(obj=>{if(obj.isMesh){obj.geometry.dispose();obj.material.dispose();}});
const controls=new OrbitControls(camera,canvas);controls.target.set(0,1.55,0);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*.92;
scene.add(new THREE.HemisphereLight(0xfff6eb,0xb0a59a,.7));
const key=new THREE.DirectionalLight(0xfff2df,2.1);key.position.set(-3,5,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-2;key.shadow.camera.right=2;key.shadow.camera.top=4;key.shadow.camera.bottom=-1;key.shadow.bias=-.0002;key.shadow.normalBias=.025;scene.add(key);
const fill=new THREE.DirectionalLight(0xe4edff,.9);fill.position.set(4,3,-2);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.5,96),new THREE.ShadowMaterial({opacity:.10}));floor.rotation.x=-Math.PI/2;floor.position.y=-.006;floor.receiveShadow=true;scene.add(floor);
const views={hero:[-3.4,2.4,6.5],front:[0,1.55,7.2],back:[0,1.55,-7.2],left:[7.2,1.55,0],right:[-7.2,1.55,0],face:[0,2.52,2.8]};
function view(name){camera.position.set(...views[name]);controls.target.set(0,name==='face'?2.52:1.55,0);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>view(button.dataset.view));
document.querySelector('#spin').onclick=function(){controls.autoRotate=!controls.autoRotate;this.setAttribute('aria-pressed',String(controls.autoRotate));this.classList.toggle('active',controls.autoRotate);};
const meshes=[];document.querySelector('#wire').onclick=function(){const enabled=this.getAttribute('aria-pressed')==='false';this.setAttribute('aria-pressed',String(enabled));this.classList.toggle('active',enabled);meshes.forEach(mesh=>mesh.material.wireframe=enabled);};
view('front');new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}).observe(stage);
try{const asset=await new GLTFLoader().loadAsync('grassy-atelier-detailed.glb');asset.scene.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;meshes.push(obj);}});scene.add(asset.scene);state.textContent='模型已加载';}
catch(error){state.textContent='模型加载失败：'+error.message;}
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
