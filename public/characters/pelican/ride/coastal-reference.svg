<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
 <title id="title">海风慢骑 · 鹈鹕骑自行车</title>
 <desc id="desc">一只白色鹈鹕戴着海蓝色骑行帽、系着珊瑚红围巾，骑着红色自行车沿海岸前行。车轮旋转，双腿与脚踏同步运动，围巾迎风摆动，海浪和路面向后移动。自包含无限循环 SVG 动画。</desc>
