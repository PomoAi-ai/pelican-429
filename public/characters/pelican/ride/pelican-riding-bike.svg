<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车 SVG 动画</title>
  <desc id="desc">一只戴头盔的鹈鹕骑着自行车沿海岸前进，车轮、脚踏、腿、围巾、云和道路都在循环运动。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeff2"/>
      <stop offset=".62" stop-color="#fff2c6"/>
      <stop offset="1" stop-color="#ffe1b0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55b7b4"/>
      <stop offset=".5" stop-color="#8ed2c5"/>
      <stop offset="1" stop-color="#3b9fb0"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36f"/>
      <stop offset=".68" stop-color="#f39c58"/>
      <stop offset="1" stop-color="#de7d43"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef5"/>
      <stop offset=".72" stop-color="#f1f7ec"/>
      <stop offset="1" stop-color="#d9e8dc"/>
    </linearGradient>
    <pattern id="road-stripe" width="210" height="34" patternUnits="userSpaceOnUse">
      <path d="M24 17h92" fill="none" stroke="#fff7dd" stroke-width="7" stroke-linecap="round"/>
    </pattern>
    <g id="cloud" fill="#fffdf2">
      <path d="M0 37c-11-26 17-47 39-29 13-35 66-31 77 3 31-8 55 10 50 35H0z"/>
    </g>
    <g id="wheel">
      <circle r="92" fill="#fff8e8" stroke="#233b42" stroke-width="14"/>
      <circle r="73" fill="none" stroke="#344f56" stroke-width="4"/>
      <g stroke="#8da4a6" stroke-width="3" stroke-linecap="round">
        <path d="M0 0L0-73M0 0L52-52M0 0L73 0M0 0L52 52M0 0L0 73M0 0L-52 52M0 0L-73 0M0 0L-52-52">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle r="13" fill="#fdf5dc" stroke="#233b42" stroke-width="5"/>
    </g>
  </defs>

  <style>
    .outline { stroke: #233b42; stroke-linecap: round; stroke-linejoin: round; }
    .bike { fill: none; stroke: #e95f54; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
    .metal { fill: none; stroke: #233b42; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
  </style>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <circle cx="980" cy="134" r="64" fill="#ffd36b"/>
  <circle cx="980" cy="134" r="86" fill="none" stroke="#ffd36b" stroke-opacity=".3" stroke-width="5"/>

  <g opacity=".9">
    <use href="#cloud" x="100" y="86"/>
    <use href="#cloud" x="420" y="132" transform="scale(.68)"/>
    <use href="#cloud" x="820" y="74" transform="scale(.84)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-42 0;0 0" dur="18s" repeatCount="indefinite"/>
  </g>

  <path d="M0 393c180-52 286-6 421-31 157-29 255-78 397-40 121 32 206 10 382-35v204H0z" fill="url(#sea)"/>
  <g fill="none" stroke="#fff8e4" stroke-width="4" stroke-linecap="round" opacity=".58">
    <path d="M44 422c74-18 132-18 207 0M406 389c92-18 171-13 252 7M792 419c89 17 173 12 265-10"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-32 0;0 0" dur="5.4s" repeatCount="indefinite"/>
  </g>

  <path d="M0 521c162-39 334-36 498-9 194 32 407 21 702-45v108H0z" fill="#d3de9e"/>
  <path d="M0 568h1200v192H0z" fill="#d9b46f"/>
  <path d="M0 602h1200v118H0z" fill="#806b55"/>
  <g>
    <rect x="-210" y="645" width="1620" height="38" fill="url(#road-stripe)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-210 0" dur="1s" repeatCount="indefinite"/>
  </g>
  <ellipse cx="610" cy="640" rx="330" ry="23" fill="#2b2820" opacity=".18">
    <animate attributeName="rx" values="330;305;330" dur=".5s" repeatCount="indefinite"/>
