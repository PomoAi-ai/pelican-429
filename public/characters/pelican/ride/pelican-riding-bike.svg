  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".5s" repeatCount="indefinite"/>

    <use href="#wheel" x="397" y="556"/>
    <use href="#wheel" x="810" y="556"/>

    <path class="bike" d="M397 556 504 421 561 556H397L485 379M504 421H691L561 556M691 421 810 556"/>
    <path class="metal" d="M691 421l-24-68 34-36h46"/>
    <path d="M730 316h44" fill="none" stroke="#e95f54" stroke-width="14" stroke-linecap="round"/>
    <path class="metal" d="M485 379l-18-51"/>
    <path d="M431 327c31-12 66-12 95 0" fill="none" stroke="#233b42" stroke-width="18" stroke-linecap="round"/>
    <circle cx="561" cy="556" r="23" fill="#fff5d8" stroke="#233b42" stroke-width="6"/>

    <g>
      <path d="M522 556h78" fill="none" stroke="#233b42" stroke-width="8" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 561 556" to="360 561 556" dur="1s" repeatCount="indefinite"/>
    </g>

    <path d="M557 399 579 478 540 556" fill="none" stroke="#d98f49" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M557 399 579 478 540 556;M557 399 604 482 598 556;M557 399 548 486 582 556;M557 399 520 475 523 556;M557 399 579 478 540 556" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M603 403 556 484 582 556" fill="none" stroke="#b9743c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
      <animate attributeName="d" values="M603 403 556 484 582 556;M603 403 531 472 523 556;M603 403 570 479 540 556;M603 403 622 486 598 556;M603 403 556 484 582 556" dur="1s" repeatCount="indefinite"/>
    </path>

    <path d="M452 364 363 319c10 47 47 78 98 82l-51 15c46 36 112 13 137-23z" fill="url(#body)" class="outline" stroke-width="5"/>
    <path d="M500 366c12-64 93-77 150-52 35 15 65 14 77-20 14-39-26-82-16-128 8-38 42-65 82-56 42 9 59 51 43 87-16 34-42 39-30 79 24 81-28 151-111 166-79 15-176-16-195-76z" fill="url(#body)" class="outline" stroke-width="5">
      <animate attributeName="d" values="M500 366c12-64 93-77 150-52 35 15 65 14 77-20 14-39-26-82-16-128 8-38 42-65 82-56 42 9 59 51 43 87-16 34-42 39-30 79 24 81-28 151-111 166-79 15-176-16-195-76z;M500 361c12-64 93-77 150-52 35 15 65 14 77-20 14-39-26-82-16-128 8-38 42-65 82-56 42 9 59 51 43 87-16 34-42 39-30 79 24 81-28 151-111 166-79 15-176-16-195-76z;M500 366c12-64 93-77 150-52 35 15 65 14 77-20 14-39-26-82-16-128 8-38 42-65 82-56 42 9 59 51 43 87-16 34-42 39-30 79 24 81-28 151-111 166-79 15-176-16-195-76z" dur=".5s" repeatCount="indefinite"/>
    </path>
    <path d="M716 208c-3 58 36 86 11 130-19 34-59 47-104 37" fill="none" stroke="#dbe8dd" stroke-width="18" stroke-linecap="round"/>

    <path d="M829 158c76 4 161 25 242 68-52 33-129 45-188 22-39-15-58-46-54-90z" fill="url(#pouch)" class="outline" stroke-width="5"/>
    <path d="M828 145c89-6 164 21 249 76 11 7 6 19-8 18l-241-56z" fill="#ffd775" class="outline" stroke-width="5"/>
    <path d="M852 178c51 3 134 23 196 47" fill="none" stroke="#d1833d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="803" cy="142" r="7" fill="#233b42"/>
    <circle cx="805" cy="139" r="2.5" fill="#fffdf2"/>

    <path d="M711 130c-2-43 29-72 77-71 47 1 80 34 78 76z" fill="#3b93a5" class="outline" stroke-width="5"/>
    <path d="M708 133h164" fill="none" stroke="#233b42" stroke-width="8" stroke-linecap="round"/>
    <path d="M743 76v35M784 65v43M824 78v35" fill="none" stroke="#b9e5df" stroke-width="7" stroke-linecap="round"/>

    <path d="M674 333c-22 7-54 4-77-18-17-16-43-18-75 6l20 23-27 17c43-18 70-10 92 12 24 24 61 26 90 8z" fill="#e95f54" class="outline" stroke-width="4">
      <animate attributeName="d" values="M674 333c-22 7-54 4-77-18-17-16-43-18-75 6l20 23-27 17c43-18 70-10 92 12 24 24 61 26 90 8z;M674 333c-26-2-50-17-71-29-24-14-47-8-82 18l24 13-18 27c38-31 67-34 96-14 21 15 48 23 74 33z;M674 333c-22 7-54 4-77-18-17-16-43-18-75 6l20 23-27 17c43-18 70-10 92 12 24 24 61 26 90 8z" dur=".5s" repeatCount="indefinite"/>
    </path>

    <path d="M623 372c65 7 90 34 104 85" fill="none" stroke="#f3f7ea" stroke-width="28" stroke-linecap="round"/>
    <path d="M623 372c65 7 90 34 104 85" fill="none" stroke="#233b42" stroke-width="5" stroke-linecap="round"/>
    <path d="M724 457c18 17 35 22 54 11" fill="none" stroke="#f3f7ea" stroke-width="20" stroke-linecap="round"/>
    <path d="M724 457c18 17 35 22 54 11" fill="none" stroke="#233b42" stroke-width="5" stroke-linecap="round"/>
  </g>
