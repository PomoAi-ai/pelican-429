<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只戴着蓝色头盔的白色鹈鹕骑着珊瑚红自行车，车轮和脚踏持续旋转，海边风景缓缓向后移动。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e5f5f4"/><stop offset="1" stop-color="#fff9e9"/></linearGradient>
    <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#ffc56c"/><stop offset="1" stop-color="#f39a52"/></linearGradient>
    <pattern id="road" width="220" height="30" patternUnits="userSpaceOnUse"><path d="M20 15h95" stroke="#fff6df" stroke-width="5" stroke-linecap="round"/></pattern>
    <g id="wheel" fill="none">
      <circle r="90" stroke="#253e48" stroke-width="12"/>
      <circle r="80" stroke="#fffbed" stroke-width="5"/>
      <g stroke="#91a8a8" stroke-width="2.5">
        <path d="M-77 0H77M0-77V77M-54.5-54.5l109 109M-54.5 54.5l109-109"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#fff8e6" stroke="#253e48" stroke-width="4"/>
    </g>
    <g id="cloud" fill="#fffef6"><path d="M0 25C-8 4 15-8 31 6C40-18 77-14 82 9C107-1 125 13 119 25Z"/></g>
  </defs>
  <path fill="url(#sky)" d="M0 0h1000v700H0z"/>
  <circle cx="797" cy="138" r="57" fill="#ffd47a"/>
  <circle cx="797" cy="138" r="72" fill="none" stroke="#ffd47a" stroke-opacity=".3" stroke-width="2"/>
  <g opacity=".85"><use href="#cloud" x="120" y="120"/><use href="#cloud" x="560" y="83" transform="scale(.8)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-35 0;0 0" dur="16s" repeatCount="indefinite"/>
  </g>
  <path d="M0 387Q160 352 320 386T640 382T1000 375V533H0Z" fill="#b7ded6"/>
  <path d="M0 429Q190 389 360 436T700 423T1000 420V550H0Z" fill="#82c6bd"/>
  <path d="M0 467Q200 439 410 476T780 462T1000 455V559H0Z" fill="#e0e5bb"/>
  <path d="M0 526H1000V700H0Z" fill="#edd9b5"/>
  <path d="M0 552H1000" stroke="#d5c19e" stroke-width="3"/>
  <g><path d="M-220 605h1440v30H-220z" fill="url(#road)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-220 0" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <g fill="none" stroke="#84aaa0" stroke-width="3" stroke-linecap="round" opacity=".65">
    <path d="M110 515l-8-15m8 15 8-19m764 15-6-16m6 16 13-10"/>
  </g>
  <ellipse cx="494" cy="565" rx="270" ry="16" fill="#8b8067" opacity=".13">
    <animate attributeName="rx" values="270;259;270" dur=".7s" repeatCount="indefinite"/>
  </ellipse>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".7s" repeatCount="indefinite"/>
    <use href="#wheel" x="319" y="463"/><use href="#wheel" x="681" y="463"/>
    <!-- Far leg and pedal, phased half a revolution behind the near leg. -->
    <path d="M465 339L494 393L485 463" fill="none" stroke="#ca813f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M465 339L494 393L485 463;M465 339L509 418L453 495;M465 339L466 420L421 463;M465 339L452 384L453 431;M465 339L494 393L485 463" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <!-- Bicycle frame -->
    <g fill="none" stroke="#ed7060" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M319 463L404 357L453 463H319L388 323M404 357H615L453 463M615 357L681 463"/>
    </g>
    <path d="M615 357L599 309L623 286H648" fill="none" stroke="#314a50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M634 286h22" stroke="#ed7060" stroke-width="12" stroke-linecap="round"/>
    <path d="M388 332l-8-25" stroke="#314a50" stroke-width="8"/>
    <path d="M355 309Q377 301 405 308" fill="none" stroke="#314a50" stroke-width="15" stroke-linecap="round"/>
    <path d="M293 359Q314 348 341 356" fill="none" stroke="#ed7060" stroke-width="6" stroke-linecap="round"/>
    <circle cx="453" cy="463" r="22" fill="#f9eed6" stroke="#314a50" stroke-width="5"/>
    <g stroke="#314a50" stroke-width="6" stroke-linecap="round">
      <path d="M421 463h64"/>
      <animateTransform attributeName="transform" type="rotate" from="180 453 463" to="540 453 463" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <!-- Pelican tail, body and long curved neck -->
    <path d="M374 277L316 246Q321 283 355 303L327 294Q338 318 374 321Z" fill="#fffdf2" stroke="#314a50" stroke-width="4" stroke-linejoin="round"/>
    <path d="M359 283C371 253 416 242 452 250C474 254 489 256 494 236C498 220 480 195 480 172C480 139 505 119 532 127C560 135 569 165 556 190C545 211 539 213 547 240C558 283 538 326 498 346C454 365 393 342 369 315C361 305 356 292 359 283Z" fill="#fffdf2" stroke="#314a50" stroke-width="4"/>
    <path d="M483 195C492 226 513 239 509 266C505 289 485 302 462 305" fill="none" stroke="#d6e4dc" stroke-width="15" stroke-linecap="round"/>
    <!-- Beak and distinctive hanging throat pouch -->
    <path d="M547 168L707 194C675 216 632 226 593 215C567 208 550 189 547 168Z" fill="url(#pouch)" stroke="#314a50" stroke-width="4" stroke-linejoin="round"/>
    <path d="M545 159Q612 159 708 190Q718 195 706 199L547 179Z" fill="#ffd276" stroke="#314a50" stroke-width="4" stroke-linejoin="round"/>
    <path d="M563 177L685 192" fill="none" stroke="#d68b43" stroke-width="2" stroke-linecap="round"/>
    <circle cx="537" cy="151" r="5.5" fill="#253e48"/>
    <circle cx="539" cy="149" r="1.8" fill="#fff"/>
    <path d="M550 192Q560 221 542 233" fill="none" stroke="#314a50" stroke-width="3"/>
    <!-- Helmet -->
    <path d="M477 141C472 111 492 94 519 95C544 95 562 114 560 138Z" fill="#4f9cad" stroke="#314a50" stroke-width="4"/>
    <path d="M475 141L566 139" stroke="#314a50" stroke-width="6" stroke-linecap="round"/>
    <path d="M494 109l-4 14m23-18-2 17m21-15 4 14" stroke="#c9e6df" stroke-width="6" stroke-linecap="round"/>
    <path d="M489 145L511 180L535 181" fill="none" stroke="#314a50" stroke-width="3"/>
    <!-- Scarf flutters in the breeze -->
    <path d="M497 230Q472 239 455 222Q440 211 420 221L429 236L415 244Q450 232 464 245Q480 258 503 243Z" fill="#ed7060" stroke="#314a50" stroke-width="3" stroke-linejoin="round">
      <animate attributeName="d" values="M497 230Q472 239 455 222Q440 211 420 221L429 236L415 244Q450 232 464 245Q480 258 503 243Z;M497 230Q474 233 454 236Q435 243 416 227L427 220L413 212Q438 223 458 223Q480 227 503 243Z;M497 230Q472 239 455 222Q440 211 420 221L429 236L415 244Q450 232 464 245Q480 258 503 243Z" dur=".7s" repeatCount="indefinite"/>
    </path>
    <!-- Wing reaches the handlebar -->
    <path d="M401 276C435 262 467 272 490 286C523 303 572 303 622 281Q636 281 632 293C590 325 535 337 493 322C462 314 429 317 413 303" fill="#f2f5e9" stroke="#314a50" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 288Q454 287 472 298M421 298Q443 298 456 307" fill="none" stroke="#b4ccc4" stroke-width="3" stroke-linecap="round"/>
    <!-- Near leg follows the pedal through one full cycle. -->
    <path d="M446 337L414 393L421 463" fill="none" stroke="#eca64f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M446 337L414 393L421 463;M446 337L435 384L453 431;M446 337L479 393L485 463;M446 337L459 420L453 495;M446 337L414 393L421 463" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <g>
      <animateMotion path="M421 463 A32 32 0 0 1 485 463 A32 32 0 0 1 421 463" dur="1.4s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M-10-5Q2-10 11-3L23 3Q26 8 16 8H-10Z" fill="#f4b65b" stroke="#314a50" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-12 11h34" stroke="#314a50" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <g fill="none" stroke="#fffdf2" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M247 279h-45m64 29h-31m30 25h-59"/>
    <animate attributeName="opacity" values=".3;.9;.3" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <text x="500" y="666" text-anchor="middle" fill="#627c79" font-family="ui-rounded, 'PingFang SC', sans-serif" font-size="14" letter-spacing="5">海风正好 · 慢慢骑</text>
</svg>
