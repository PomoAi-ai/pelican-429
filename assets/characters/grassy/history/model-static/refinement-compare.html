<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grassy · 静态模型精修对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6e1;color:#292c2b;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1550px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:25px;margin:6px 0}p{font-size:14px;color:#626561;line-height:1.7;margin:4px 0}small{color:#846858;letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,a{color:inherit;font:inherit;font-size:13px}button{border:1px solid #bcbab3;border-radius:30px;padding:9px 18px;background:#f6f3ed;cursor:pointer}button[aria-pressed=true]{background:#303e38;color:white;border-color:#303e38}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}figure{margin:0;min-width:0;border:1px solid #c9c6bf;border-radius:12px;overflow:hidden;background:#f7f4ef}figcaption{padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;gap:8px}figcaption span{color:#73746e;font-size:12px}.frame{aspect-ratio:900/1035;display:block;width:100%;background:#c4c8cb;overflow:hidden}.frame img,.frame canvas{display:block;width:100%;height:100%;object-fit:contain}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.detail-grid img{width:100%;display:block}.detail-grid a{text-decoration:none}.detail-grid figcaption{font-size:12px}footer{border-top:1px solid #cac6be;padding-top:16px;margin-top:22px;display:flex;gap:18px;flex-wrap:wrap}#error{color:#a52424;white-space:pre-wrap}@media(max-width:800px){main{padding:16px}.grid{gap:7px}figcaption{padding:10px;font-size:12px;display:block}figcaption span{display:block;margin-top:3px}.detail-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<main>
<header><div><small>PELICAN 429 / GRASSY</small><h1>静态模型 · 精修对照</h1><p>参考原画、旧模型与当前模型按同一可见高度排列。上版为 Blender 渲染，本轮为游戏同源渲染；材质对比请看同光照的正侧面总图。</p></div><a href="/?mode=showcase&amp;demo=grassy-models">打开可旋转的三维展示场 ↗</a></header>
<nav aria-label="对照方向"><button data-view="front" aria-pressed="true">正面</button><button data-view="right" aria-pressed="false">右侧</button><button data-view="back" aria-pressed="false">背面</button><button data-view="left" aria-pressed="false">左侧</button></nav>
<div class="grid">
<figure><figcaption>已确认参考<span>绘制原图</span></figcaption><div class="frame"><canvas id="reference" width="900" height="1035" aria-label="已确认的角色参考图"></canvas></div></figure>
<figure><figcaption>上一版 gpt6.1astra<span>本轮修改前</span></figcaption><div class="frame"><img id="before" alt="本轮修改前的模型"></div></figure>
<figure><figcaption>gpt6.1astra版本<span>精修后真实渲染</span></figcaption><div class="frame"><img id="after" alt="gpt6.1astra版本模型"></div></figure>
</div>
<p>全高仍为 3.10 格。原画包含局部透视与绘制差异；对照保留原图比例，没有局部拉伸。</p>
<div class="detail-grid" aria-label="当前模型细节渲染">
<figure><a href="/characters/human/history/models/render-detailed-face-front.png" target="_blank"><img src="/characters/human/history/models/render-detailed-face-front.png" alt="正面头脸与头发细节"><figcaption>头脸 · 正面</figcaption></a></figure>
<figure><a href="/characters/human/history/models/render-detailed-face.png" target="_blank"><img src="/characters/human/history/models/render-detailed-face.png" alt="侧前方脸颊眼睑头发细节"><figcaption>头脸 · 斜侧</figcaption></a></figure>
<figure><a href="/characters/human/history/models/render-detailed-cloth.png" target="_blank"><img src="/characters/human/history/models/render-detailed-cloth.png" alt="针织毛衣和牛仔裤细节"><figcaption>针织 · 衣褶 · 丹宁</figcaption></a></figure>
<figure><a href="/characters/human/history/models/render-detailed-shoes.png" target="_blank"><img src="/characters/human/history/models/render-detailed-shoes.png" alt="卷边牛仔裤与鞋子细节"><figcaption>卷边 · 鞋面 · 鞋带</figcaption></a></figure>
</div>
<pre id="error" role="alert"></pre>
<footer><a href="../static-model-scene.html">进入实际游戏场景 ↗</a><a href="grassy-detailed.blend">Blender 精细源文件</a><a href="/characters/human/history/models/grassy-detailed.glb">精细 GLB</a><a href="/characters/human/history/models/manifest.json">模型实际数据</a></footer>
</main>
<script type="module">
const canvas=document.getElementById('reference');
const context=canvas.getContext('2d');
let requestedView;
async function show(view){
  requestedView=view;
  document.getElementById('before').src=`before-fine-detail/public/render-detailed-${view}.png`;
  document.getElementById('after').src=`/characters/human/history/models/render-detailed-${view}.png`;
  const img=new Image(); img.src=`/characters/human/history/turnaround-master-v2/${view}.png`;
  await img.decode();
  if(requestedView!==view)return;
  const source=document.createElement('canvas');source.width=img.width;source.height=img.height;
  const ctx=source.getContext('2d');ctx.drawImage(img,0,0);
  const pixels=ctx.getImageData(0,0,img.width,img.height).data;
  let x0=img.width,y0=img.height,x1=0,y1=0;
  for(let y=0;y<img.height;y++)for(let x=0;x<img.width;x++)if(pixels[(y*img.width+x)*4+3]>32){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
  const height=1035*3.1/3.55,width=(x1-x0+1)*height/(y1-y0+1);
  context.clearRect(0,0,900,1035);context.drawImage(img,x0,y0,x1-x0+1,y1-y0+1,(900-width)/2,(1035-height)/2,width,height);
}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{
  for(const item of document.querySelectorAll('[data-view]'))item.setAttribute('aria-pressed',String(item===button));
  show(button.dataset.view).catch(error=>{document.getElementById('error').textContent=error.message;throw error;});
};
show('front').catch(error=>{document.getElementById('error').textContent=error.message;throw error;});
</script>
</html>
