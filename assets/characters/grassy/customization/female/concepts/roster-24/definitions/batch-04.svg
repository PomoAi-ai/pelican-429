<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#f6f8fc"/><text x="48" y="60" font-family="PingFang SC,Arial,sans-serif" font-size="36" fill="#20497a">24款角色定义 · 第4批</text><text x="48" y="100" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#61738c">目标3.3头身｜同骨架、变体宽厚｜每批4款｜本页为定义，不表示已绘制</text><rect x="40" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R13  学院休闲</text><text x="65" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">纤细｜春秋｜已绘制·待核对</text><text x="65" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：短心形脸；紫灰圆眼；平缓眉，轻微微笑</text><text x="65" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：银紫不对称短波波；一侧耳上，另一侧到下巴</text><text x="65" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：藏蓝短西装、浅灰针织内搭、灰蓝格纹A字裙</text><text x="65" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：黑色乐福鞋、灰色短袜</text><text x="65" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：哑光毛料、小比例格纹；格纹不变成噪点</text><text x="65" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：后背西装两条省线；侧面领口和袖口层次可见；不加入学生年</text><text x="65" y="472" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">龄或校徽设定</text><rect x="820" y="135" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="180" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R14  春日花瓣裙</text><text x="845" y="213" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">均衡｜春夏｜已绘制·待核对</text><text x="845" y="253" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：柔和椭圆脸；浅棕圆眼；细眉，温柔表情</text><text x="845" y="291" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：蜂蜜金半扎长卷发；发尾至肩胛，不遮腰</text><text x="845" y="329" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：灰玫瑰色短袖连衣裙、花瓣叠片裙摆、奶油细腰带</text><text x="845" y="367" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：奶油平底鞋；小花发饰</text><text x="845" y="405" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：哑光轻织物；花瓣为少量大叠片，内层不透明</text><text x="845" y="443" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：背面小腰带结，花瓣层数与正面一致；侧面裙身不紧贴身体</text><rect x="40" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="65" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R15  咖啡师</text><text x="65" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">微胖｜四季·室内｜已绘制·待核对</text><text x="65" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：饱满圆脸；榛色圆眼；厚柔眉，浅酒窝</text><text x="65" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：焦糖棕低双丸子；短卷刘海，体积不超过脸宽</text><text x="65" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：奶油衬衣、咖啡棕短围裙、深绿宽松长裤</text><text x="65" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：棕色软底工作鞋</text><text x="65" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：棉麻衬衣、帆布围裙；口袋边缘清楚</text><text x="65" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：围裙背带和背后系结完整；肚腹臀部有圆润体积；不拿杯子遮</text><text x="65" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">挡手指</text><rect x="820" y="745" width="760" height="585" rx="18" fill="white" stroke="#dce4ed"/><text x="845" y="790" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#20497a">R16  消防员</text><text x="845" y="823" font-family="PingFang SC,Arial,sans-serif" font-size="20" fill="#627c79">健壮｜四季·防护｜已绘制·待核对</text><text x="845" y="863" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">脸型：宽方圆脸；棕色圆眼；粗直眉，沉稳表情</text><text x="845" y="901" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">发型：棕色短碎发；露耳，干净后颈</text><text x="845" y="939" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">服装：深炭色防护夹克与长裤、黄灰反光带</text><text x="845" y="977" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">鞋履：深色防护靴；头盔单独附件，基础图不戴</text><text x="845" y="1015" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">材质：厚织物、橡胶鞋底；反光带不画成发光灯带</text><text x="845" y="1053" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">多视图：前后反光带高度一致；侧面关节可屈；不让厚外衣导致头身比</text><text x="845" y="1082" font-family="PingFang SC,Arial,sans-serif" font-size="21" fill="#26384c">变小</text></svg>