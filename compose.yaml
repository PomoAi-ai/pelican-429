name: pelican-429

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - .:/app:ro
      - type: volume
        source: node_modules
        target: /app/node_modules
        volume:
          nocopy: true
    command: sh -c 'npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5174 --strictPort'

volumes:
  node_modules:
